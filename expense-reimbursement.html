<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Expense Reimbursement</title>
</head>
<body>

  <header class="header-color">
    <div class="header-layout">
    <h1>Expense Reimbursement</h1>
    <p>Submit one business expense for reimbursement.</p>
    </div>
  </header>

  <main class="main-layout">
    <section class="intro-layout">
      <h2>Before You Submit</h2>
      <p>
        Complete the required fields below.
        Keep your receipt available when company policy requires one.
      </p>
    </section>

    <section>
      <h2>Expense Details</h2>
      <form method="get">
        <fieldset>
        <legend>Expense Information</legend>

          <div class="form-group">
          <label for="employeeId">Employee ID</label>
          <input
            id="employeeId"
            name="employeeId"
            type="text"
            required
          >
          </div>

          <div class="expense-row">
            <div class="form-group">
            <label for="expenseDate">Expense Date</label>
            <input
              id="expenseDate"
              name="expenseDate"
              type="date"
              required
            >
            </div>
            
            <div class="form-group">
            <label for="amount">Expense Amount ($)</label>
            <input
              id="amount"
              name="amount"
              type="number"
              required
              min="0.01"
              step="0.01"
            >
            </div>
          </div>

          <div class="form-group">
          <label for="category">Category</label>
          <select
            id="category"
            name="category"
            required
          >
            <option value="">Choose a category</option>
            <option value="travel">Travel</option>
            <option value="meals">Meals</option>
            <option value="supplies">Supplies</option>
            <option value="other">Other</option>
          </select>
          </div>

          <div class="form-group">
          <label for="description">Business Purpose / Description</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            cols="45"
            required
          ></textarea>
          </div>

          <div class="checkbox-layout">
          <label for="receiptAttached">Receipt attached</label>
          <input
            id="receiptAttached"
            name="receiptAttached"
            type="checkbox"
            value="yes"
          >
          </div>
        </fieldset>

        <div>
        <button type="submit">
          Submit Request
        </button>
        </div>
        
      </form>
    </section>
  </main>

  <footer class="footer-layout">
    <p>MIS 3371 — Week 4 Live Demo</p>
  </footer>

</body>
</html>
